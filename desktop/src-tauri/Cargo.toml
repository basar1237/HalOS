[package]
name = "halos-terminal"
version = "0.1.0"
description = "HalOS Hal Terminali — offline-first masaüstü (ADR-005)"
authors = ["HalOS"]
edition = "2021"
rust-version = "1.77.2"

# Kütüphane hedefi: Tauri v2 mobil/masaüstü ortak giriş noktası.
[lib]
name = "halos_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Bu özellik prodüksiyon derlemelerinde devtools'u kapatmak içindir.
custom-protocol = ["tauri/custom-protocol"]
